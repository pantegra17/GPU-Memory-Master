name: Automatic Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Release Notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -c "
          import os, subprocess, re
          tag = os.environ.get('TAG_NAME', '')
          notes = ''
          try:
              out = subprocess.check_output(['git', 'tag', '-l', '--format=%(contents)', tag], text=True).strip()
              if out:
                  notes = out
          except Exception:
              pass
          if not notes:
              try:
                  content = open('README.md', encoding='utf-8').read()
                  m = re.search(r\"## What's New[^\n]*\n([\s\S]*?)(?=\n## |\n<|\Z)\", content)
                  notes = m.group(0).strip() if m else ''
              except Exception:
                  notes = ''
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(notes + '\n\n')
          "

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --yes
          fi
          gh release create "$TAG_NAME" \
            --title "GPU Memory Master $TAG_NAME" \
            --notes-file release_notes.md \
            --generate-notes
